<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Glaze page root vs component root: 500 child component updates</title>
  <desc id="desc">Grouped bars comparing Glaze component root, Glaze page root, native WXML page and uni-app for updating 500 real child components with 1, 2, 4, 8 and 16 props. Lower is better.</desc>
