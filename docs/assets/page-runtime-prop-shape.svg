  <text x="64" y="38" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#111827">500 real child components: updating every row</text>
  <text x="64" y="64" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#4b5563">Glaze page root removes the &lt;glaze-page&gt; component layer. Lower is better.</text>

